<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dyor Apps</title>
    <meta name="description" content="Habit Hero and Indie Playbook: mobile apps by Matt Dyor.">
    <link rel="icon" href="habit-hero/images/favicon.ico" type="image/x-icon">
    <style>
        :root {
            --bg: #090D16;
            --card: rgba(18, 24, 38, 0.85);
            --card-hover: rgba(28, 36, 56, 0.95);
            --border: rgba(255, 255, 255, 0.09);
            --text: #F8FAFC;
            --muted: #94A3B8;
            --accent: #6366F1;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
        }

        h1 { margin: 0 0 8px; font-size: 1.75rem; }
        .lede { margin: 0 0 32px; color: var(--muted); text-align: center; }

        .apps {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 640px;
        }

        .app {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 20px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card);
            color: inherit;
            text-decoration: none;
            transition: background 0.15s, border-color 0.15s;
        }

        .app:hover, .app:focus-visible { background: var(--card-hover); border-color: var(--accent); }
        .app img { width: 56px; height: 56px; border-radius: 12px; flex-shrink: 0; object-fit: cover; }
        .app h2 { margin: 0 0 4px; font-size: 1.1rem; }
        .app p { margin: 0; color: var(--muted); font-size: 0.9rem; line-height: 1.4; }

        footer { margin-top: 40px; color: var(--muted); font-size: 0.85rem; }
        footer a { color: var(--muted); }
    </style>
</head>

<body>
    <h1>Dyor Apps</h1>
    <p class="lede">Mobile apps for Android and iOS.</p>

    <main class="apps">
        <a class="app" href="habit-hero/">
            <img src="habit-hero/images/logo.png" alt="">
            <div>
                <h2>Habit Hero</h2>
                <p>Turn daily habits into superhero comic covers.</p>
            </div>
        </a>
        <a class="app" href="indie-playbook/">
            <img src="indie-playbook/images/icon.png" alt="">
            <div>
                <h2>Indie Playbook</h2>
                <p>How top indie cross-platform apps got built, launched, and grown.</p>
            </div>
        </a>
    </main>

    <footer>Contact: <a href="mailto:matt@dyor.com">matt@dyor.com</a></footer>
</body>

</html>
