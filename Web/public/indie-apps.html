<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to Latest Indie Apps Dashboard (Zipline)...</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .sub {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 6px;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
    }
  </style>
  <script>
    (async function() {
      const FALLBACK_ASSET_URL = "https://serve-dot-zipline.googleplex.com/asset/8e64958f-1ffb-5f54-9fff-a4d37d698328/";
      const FIRESTORE_URL = "https://firestore.googleapis.com/v1/projects/koko-demo-71050/databases/(default)/documents/story_suggestions/zipline_latest_pointer";
      const suffix = (window.location.search || "") + (window.location.hash || "");

      try {
        const res = await fetch(FIRESTORE_URL, { cache: "no-store" });
        if (res.ok) {
          const data = await res.json();
          const latestUrl = data.fields && data.fields.zipline_url && data.fields.zipline_url.stringValue;
          if (latestUrl && latestUrl.startsWith("https://")) {
            const cleanBase = latestUrl.endsWith("/") ? latestUrl : (latestUrl + "/");
            window.location.replace(cleanBase + suffix);
            return;
          }
        }
      } catch (e) {
        console.warn("Firestore pointer lookup failed, falling back:", e);
      }

      window.location.replace(FALLBACK_ASSET_URL);
    })();
  </script>
</head>
<body>
  <div class="spinner"></div>
  <div><strong>Opening Latest Indie Apps Zipline Build...</strong></div>
  <div class="sub">If not redirected automatically, <a id="manualLink" href="https://serve-dot-zipline.googleplex.com/asset/8e64958f-1ffb-5f54-9fff-a4d37d698328/">click here</a>.</div>
</body>
</html>
